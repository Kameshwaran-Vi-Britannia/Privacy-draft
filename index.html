<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PrivacyGuard | Personal Data Privacy Toolkit</title>
<style>
:root{--bg:#f4f5f7;--pan:#fff;--ink:#131a2b;--mut:#5a6479;--line:#dcdfe6;--ac:#1f3fbf;--acs:#e8edff;--acx:#fff;--warn:#b45309;--good:#0f766e;--bad:#b4232c;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--pan:#151d33;--ink:#eaf0ff;--mut:#9eabc6;--line:#28344f;--ac:#8fb0ff;--acs:#1b2850;--acx:#0e1424;--warn:#f0b25a;--good:#5fd3b4;--bad:#ff8f98}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--pan);padding:9px 14px;border-radius:var(--r);font-weight:600}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:transparent}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--pan);border-bottom:1px solid var(--line)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0}
.logo{display:flex;gap:12px;align-items:center}
.mark{width:40px;height:40px;border-radius:9px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-size:20px}
.logo h1{font-size:20px}.logo p{margin:0;color:var(--mut);font-size:13px}
.chip{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mut)}
.chip.ok{color:var(--good);border-color:var(--good)}
nav{position:sticky;top:0;z-index:5;background:var(--pan);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 14px;white-space:nowrap;color:var(--mut)}
